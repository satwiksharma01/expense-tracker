name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Run tests
        run: sh test.sh
      - name: Build application
        run: sh build.sh
      - name: Check command-line entry point
        run: java -jar expense-tracker.jar --help
